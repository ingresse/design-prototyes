<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800">
  <!-- Capa ilustrativa do Gop Tun Festival 2026 (arte original do protótipo, não é a capa oficial).
       Texto em cima e embaixo; a faixa entre 58% e 78% fica só com grafismo, para o recorte do banner. -->
  <defs>
    <radialGradient id="brilho" cx="50%" cy="54%" r="70%">
      <stop offset="0" stop-color="#ff5a3c"/>
      <stop offset=".35" stop-color="#c81e3a"/>
      <stop offset=".7" stop-color="#3a0d24"/>
      <stop offset="1" stop-color="#0b0b0f"/>
    </radialGradient>
    <linearGradient id="onda" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffd27a" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <rect width="600" height="800" fill="#0b0b0f"/>
  <rect width="600" height="800" fill="url(#brilho)"/>
  <!-- Sol de pista: anéis concêntricos -->
  <g fill="none" stroke="#ffb199" stroke-opacity=".35">
    <circle cx="300" cy="430" r="70" stroke-width="2"/>
    <circle cx="300" cy="430" r="120" stroke-width="2"/>
    <circle cx="300" cy="430" r="175" stroke-width="1.5"/>
    <circle cx="300" cy="430" r="235" stroke-width="1.2"/>
    <circle cx="300" cy="430" r="300" stroke-width="1"/>
  </g>
  <circle cx="300" cy="430" r="46" fill="#ffd27a" filter="url(#blur)" opacity=".85"/>
  <circle cx="300" cy="430" r="30" fill="#fff1d6"/>
  <!-- Ondas sonoras na faixa do recorte -->
  <path d="M-20 520 C 60 470, 120 570, 200 520 S 340 470, 420 520 S 560 570, 640 520" stroke="url(#onda)" stroke-width="5" fill="none"/>
  <path d="M-20 560 C 70 520, 130 600, 210 560 S 350 520, 430 560 S 570 600, 640 560" stroke="url(#onda)" stroke-width="3" fill="none" opacity=".7"/>
  <path d="M-20 600 C 80 570, 140 630, 220 600 S 360 570, 440 600 S 580 630, 640 600" stroke="url(#onda)" stroke-width="2" fill="none" opacity=".5"/>
  <!-- Barras de equalizador no rodapé da faixa -->
  <g fill="#ff5a3c" opacity=".55">
    <rect x="40" y="610" width="10" height="40" rx="5"/><rect x="62" y="590" width="10" height="60" rx="5"/><rect x="84" y="620" width="10" height="30" rx="5"/>
    <rect x="506" y="600" width="10" height="50" rx="5"/><rect x="528" y="580" width="10" height="70" rx="5"/><rect x="550" y="615" width="10" height="35" rx="5"/>
  </g>
  <!-- Título -->
  <text x="300" y="120" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="24" letter-spacing="14" fill="#ffd9cc">FESTIVAL</text>
  <text x="300" y="225" text-anchor="middle" font-family="Arial Black, Helvetica Neue, Arial, sans-serif" font-weight="900" font-size="100" letter-spacing="0" fill="#ffffff">GOP TUN</text>
  <text x="300" y="285" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="40" letter-spacing="18" fill="#ffd27a">2026</text>
  <!-- Rodapé -->
  <rect x="0" y="680" width="600" height="120" fill="#0b0b0f" opacity=".75"/>
  <text x="300" y="730" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-weight="700" font-size="30" letter-spacing="6" fill="#ffffff">SÁB · 11 ABR · 16H</text>
  <text x="300" y="768" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="18" letter-spacing="4" fill="#ffb199">AUDIO · SÃO PAULO</text>
</svg>
